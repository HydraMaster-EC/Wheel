<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Classroom Raffle Wheel</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <div class="eyebrow">Pick a name, fair &amp; square</div>
    <h1>Classroom Raffle Wheel</h1>
    <p class="sub">One wheel per class. Add your roster, spin, and let it choose.</p>
    <div class="tabs" id="tabs"></div>
  </header>

  <main id="groups"></main>

  <footer class="credit">Names and settings are saved in this browser per class tab.</footer>

  <div id="winnerOverlay" class="winner-overlay hidden">
    <div class="winner-ticket">
      <div class="winner-eyebrow">The wheel has spoken</div>
      <div class="winner-name" id="winnerName"></div>
      <button id="closeWinner" class="winner-close">Nice</button>
    </div>
  </div>

  <template id="groupTemplate">
    <section class="group-panel">
      <div class="panel-grid">
        <div class="wheel-column">
          <div class="wheel-wrap">
            <svg class="pointer" viewBox="0 0 34 34" aria-hidden="true">
              <path d="M17 30 L4 8 A17 17 0 0 1 30 8 Z" fill="var(--accent-2)" stroke="var(--surface)" stroke-width="2"/>
            </svg>
            <canvas class="wheel-canvas" width="500" height="500"></canvas>
          </div>
          <div class="wheel-controls">
            <button class="spin-btn">Spin the Wheel</button>
            <label class="remove-winner-label">
              <input type="checkbox" class="remove-winner-checkbox" />
              Remove winner after spin (comes back on reload)
            </label>
          </div>
        </div>

        <div class="names-column">
          <div class="ticket">
            <div class="ticket-stub">
              <input type="text" class="group-title-input" maxlength="40" />
            </div>
            <div class="ticket-perforation"></div>
            <div class="ticket-body">
              <div class="add-name-row">
                <input type="text" class="name-input" placeholder="Add a name and press Enter" />
                <button class="btn add-name-btn">Add</button>
              </div>

              <details class="bulk-add">
                <summary>Bulk add / edit list (one name per line)</summary>
                <textarea class="bulk-textarea" rows="6" placeholder="Alex&#10;Jamie&#10;Sam&#10;..."></textarea>
                <button class="btn bulk-apply-btn">Apply List</button>
              </details>

              <ul class="name-list"></ul>

              <div class="list-actions">
                <span class="name-count">0 names</span>
                <button class="btn btn-danger clear-btn">Clear All</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </template>

  <script src="app.js"></script>
</body>
</html>
